<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="blueBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#blueBg)"/>
  <!-- Antenna -->
  <line x1="16" y1="5" x2="16" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="4" r="1.5" fill="white"/>
  <!-- Head -->
  <rect x="8" y="9" width="16" height="14" rx="3.5" stroke="white" stroke-width="2" fill="none"/>
  <!-- Eyes -->
  <circle cx="12.5" cy="16" r="1.8" fill="white"/>
  <circle cx="19.5" cy="16" r="1.8" fill="white"/>
  <!-- Mouth -->
  <line x1="12" y1="20.5" x2="20" y2="20.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Ears -->
  <line x1="6" y1="14.5" x2="8" y2="14.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="14.5" x2="26" y2="14.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
