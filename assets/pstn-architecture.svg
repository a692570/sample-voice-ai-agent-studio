<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Inter, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">PSTN Relay Server Architecture — Twilio TAC Bridge</text>

  <!-- Caller -->
  <rect x="30" y="60" width="180" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Caller</text>
  <text x="120" y="100" text-anchor="middle" font-size="10" fill="#78350f">PSTN phone call</text>
  <text x="120" y="115" text-anchor="middle" font-size="10" fill="#92400e">Any phone number</text>

  <!-- Arrow: Caller → Twilio -->
  <line x1="210" y1="95" x2="270" y2="95" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="85" text-anchor="middle" font-size="9" fill="#64748b">PSTN</text>

  <!-- Twilio -->
  <rect x="270" y="55" width="200" height="80" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="370" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Twilio</text>
  <text x="370" y="95" text-anchor="middle" font-size="10" fill="#dc2626">Manages PSTN + RTP + codec</text>
  <text x="370" y="110" text-anchor="middle" font-size="10" fill="#991b1b">Webhook + Media Streams API</text>
  <text x="370" y="125" text-anchor="middle" font-size="10" fill="#dc2626">μ-law 8kHz → base64 WebSocket</text>

  <!-- Arrow: Twilio → CloudFront -->
  <line x1="470" y1="95" x2="530" y2="95" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="85" text-anchor="middle" font-size="9" fill="#64748b">HTTPS/WSS</text>

  <!-- AWS Cloud boundary -->
  <rect x="520" y="45" width="460" height="640" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="540" y="63" font-size="11" font-weight="600" fill="#64748b">AWS Cloud (us-east-1)</text>

  <!-- CloudFront -->
  <rect x="540" y="70" width="180" height="65" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="630" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">CloudFront</text>
  <text x="630" y="106" text-anchor="middle" font-size="10" fill="#7c3aed">TLS termination (HTTPS/WSS)</text>
  <text x="630" y="120" text-anchor="middle" font-size="10" fill="#7c3aed">WebSocket proxy • Shield Standard</text>

  <!-- Arrow: CloudFront → ALB -->
  <line x1="630" y1="135" x2="630" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VPC boundary -->
  <rect x="540" y="160" width="420" height="280" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="180" font-size="12" font-weight="600" fill="#1d4ed8">VPC: 10.0.0.0/16</text>
  <text x="560" y="195" font-size="10" fill="#3b82f6">Public subnets only • No NAT Gateway</text>

  <!-- Public Subnet -->
  <rect x="560" y="205" width="380" height="220" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
  <text x="580" y="225" font-size="11" font-weight="600" fill="#065f46">Public Subnets</text>
  <text x="580" y="240" font-size="10" fill="#047857">AZ-a: 10.0.0.0/24 • AZ-b: 10.0.1.0/24 • Internet Gateway</text>

  <!-- ALB -->
  <rect x="580" y="255" width="170" height="70" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="665" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">Application Load Balancer</text>
  <text x="665" y="292" text-anchor="middle" font-size="10" fill="#6366f1">HTTP :80 • Idle timeout 3600s</text>
  <text x="665" y="307" text-anchor="middle" font-size="10" fill="#6366f1">Stickiness enabled (WebSocket)</text>
  <text x="665" y="320" text-anchor="middle" font-size="10" fill="#4338ca">Health: GET /health → 200</text>

  <!-- Arrow: ALB → Fargate -->
  <line x1="665" y1="325" x2="665" y2="350" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fargate Task -->
  <rect x="580" y="350" width="340" height="60" rx="6" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <text x="750" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ECS Fargate Task</text>
  <text x="750" y="387" text-anchor="middle" font-size="10" fill="#047857">256 CPU / 512 MiB • Public IP • Port 8080</text>
  <text x="750" y="402" text-anchor="middle" font-size="10" fill="#065f46">TAC Bridge (Python FastAPI): /twiml • /connect • /media-stream • /health</text>

  <!-- IAM Role -->
  <rect x="540" y="455" width="420" height="40" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="560" y="475" font-size="11" font-weight="600" fill="#854d0e">IAM: Task Role</text>
  <text x="560" y="490" font-size="10" fill="#a16207">bedrock-agentcore:* • dynamodb:GetItem/Scan/Query/Put • sts:GetCallerIdentity</text>

  <!-- Arrow: Fargate → AgentCore -->
  <line x1="750" y1="410" x2="750" y2="520" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="770" y="470" font-size="9" fill="#10b981">WSS (SigV4 presigned)</text>

  <!-- AgentCore -->
  <rect x="540" y="520" width="280" height="80" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="680" y="542" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Amazon Bedrock AgentCore</text>
  <text x="680" y="558" text-anchor="middle" font-size="10" fill="#0284c7">Bidirectional Runtime (WebSocket)</text>
  <text x="680" y="576" text-anchor="middle" font-size="11" fill="#0369a1">BidiAgent + Nova 2 Sonic</text>
  <text x="680" y="592" text-anchor="middle" font-size="10" fill="#0284c7">PCM 16kHz bidirectional audio</text>

  <!-- DynamoDB -->
  <rect x="840" y="520" width="120" height="80" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="900" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">DynamoDB</text>
  <text x="900" y="560" text-anchor="middle" font-size="9" fill="#b45309">voice-agent-</text>
  <text x="900" y="573" text-anchor="middle" font-size="9" fill="#b45309">poc-demos</text>
  <text x="900" y="590" text-anchor="middle" font-size="9" fill="#92400e">Agent configs</text>

  <!-- Arrow: Fargate → DynamoDB -->
  <line x1="900" y1="410" x2="900" y2="520" stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="915" y="470" font-size="9" fill="#92400e">HTTPS</text>

  <!-- Legend -->
  <rect x="30" y="530" width="260" height="145" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="552" font-size="11" font-weight="600" fill="#334155">Key Differences from SIP</text>
  <text x="50" y="572" font-size="10" fill="#475569">✓ No open UDP ports</text>
  <text x="50" y="588" font-size="10" fill="#475569">✓ No hostNetwork required</text>
  <text x="50" y="604" font-size="10" fill="#475569">✓ No NAT Gateway needed</text>
  <text x="50" y="620" font-size="10" fill="#475569">✓ Twilio handles all RTP/codec</text>
  <text x="50" y="636" font-size="10" fill="#475569">✓ HTTPS/WSS only (TLS everywhere)</text>
  <text x="50" y="652" font-size="10" fill="#475569">✓ Standard Fargate (no EKS)</text>
  <text x="50" y="668" font-size="10" fill="#475569">✓ Multiple agents per phone number</text>

  <!-- Audio conversion note -->
  <rect x="30" y="160" width="230" height="100" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="182" font-size="11" font-weight="600" fill="#334155">Audio Conversion</text>
  <text x="50" y="200" font-size="10" fill="#475569">Inbound:</text>
  <text x="50" y="214" font-size="10" fill="#475569">μ-law 8kHz → PCM 16kHz (2x up)</text>
  <text x="50" y="234" font-size="10" fill="#475569">Outbound:</text>
  <text x="50" y="248" font-size="10" fill="#475569">PCM 16/24kHz → μ-law 8kHz (down)</text>

  <!-- Endpoints note -->
  <rect x="30" y="280" width="230" height="110" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="302" font-size="11" font-weight="600" fill="#334155">Bridge Endpoints</text>
  <text x="50" y="320" font-size="10" fill="#475569">POST /twiml — Voice webhook</text>
  <text x="50" y="336" font-size="10" fill="#475569">POST /connect — DTMF handler</text>
  <text x="50" y="352" font-size="10" fill="#475569">WS /media-stream — Audio bridge</text>
  <text x="50" y="368" font-size="10" fill="#475569">GET /health — ALB health check</text>
  <text x="50" y="384" font-size="10" fill="#64748b">All via CloudFront (HTTPS)</text>
</svg>
